[project]
name = "database"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gdown>=6.4.2",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
